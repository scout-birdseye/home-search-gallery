<script>
const GALLERY = window.GALLERY_DATA;
const state   = { filter: 'all', sort: false };

// ── Saved state ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'birdseye-saved';

function getSaved() {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
    catch { return new Set(); }
}

function setSaved(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...s]));
    updateSavedBtn();
}

function updateSavedBtn() {
    const n = getSaved().size;
    const btn = document.getElementById('saved-filter-btn');
    if (btn) btn.textContent = `♥ Saved (${n})`;
}

function toggleSave(address, btn, event) {
    event.preventDefault(); event.stopPropagation();
    const saved = getSaved();
    if (saved.has(address)) { saved.delete(address); btn.classList.remove('saved'); btn.textContent = '♡'; }
    else                    { saved.add(address);    btn.classList.add('saved');    btn.textContent = '♥'; }
    setSaved(saved);
    if (state.filter === 'saved') render();
}

// ── Share & Export ────────────────────────────────────────────────────────────
function shareList() {
    const saved = [...getSaved()];
    if (!saved.length) { alert('Save some properties first, then share.'); return; }
    const encoded = btoa(JSON.stringify(saved));
    const url = `${location.origin}${location.pathname}?saves=${encoded}`;
    navigator.clipboard.writeText(url).then(() => alert(`Link copied!\n\nShare this URL with Alia — her browser will load your saved list.`))
        .catch(() => prompt('Copy this link:', url));
}

function exportCSV() {
    const saved = getSaved();
    if (!saved.size) { alert('Save some properties first.'); return; }
    let all = [];
    for (const [, list] of Object.entries(GALLERY.streets)) list.forEach(c => all.push(c));
    const rows = all.filter(c => saved.has(c.address));
    const header = 'Address,ZIP,Owner,Beds/Bath,Basement,Appraised,Condition,Section';
    const lines = rows.map(c => [
        c.address, c.zip, c.owner, c.beds_bath, c.basement, c.appraised,
        c.condition.replace(/\s*⚠️\S+/,'').trim(), c.section
    ].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
    const csv = [header, ...lines].join('\n');
    const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([csv], {type:'text/csv'})),
        download: 'birdseye-saved-properties.csv'
    });
    a.click();
}

// ── Load shared saves from URL ────────────────────────────────────────────────
(function loadSharedSaves() {
    const p = new URLSearchParams(location.search).get('saves');
    if (!p) return;
    try {
        const imported = JSON.parse(atob(p));
        const existing = getSaved();
        imported.forEach(a => existing.add(a));
        setSaved(existing);
        history.replaceState({}, '', location.pathname);
    } catch {}
})();

function esc(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function condColor(c) {
    if (c.includes('Very Good+')) return '#065f46';
    if (c.includes('Very Good'))  return '#047857';
    if (c.includes('Good+'))      return '#059669';
    if (c.includes('Good'))       return '#16a34a';
    if (c.includes('Average+'))   return '#d97706';
    if (c.includes('Average'))    return '#b45309';
    if (c.includes('Fair'))       return '#dc2626';
    return '#6b7280';
}

const SECTION_META = {
    'move-in-ready': ['✅ Move-In Ready', 'badge-green'],
    'fixer-upper':   ['🔧 Fixer Upper',   'badge-yellow'],
    'over-budget':   ['💛 Over Budget',   'badge-pink'],
};

function cardHtml(c, savedSet) {
    const isSaved  = savedSet.has(c.address);
    const dm       = (c.condition || '').match(/⚠️\d+late/);
    const distress = dm ? dm[0] : '';
    const cond     = (c.condition || '').replace(/\s*⚠️\S+/, '').trim();
    const [secLabel, secClass] = SECTION_META[c.section] || [c.section, 'badge-gray'];
    const feats = c.features && c.features !== '—'
        ? `<div class="feats">${esc(c.features)}</div>` : '';
    const distressHtml = distress
        ? ` <span class="distress">${esc(distress)}</span>` : '';
    const addr = esc(c.address);
    return `
<div class="card">
  <div class="card-img">
    <img src="${esc(c.image)}" alt="${addr}" loading="lazy">
    <button class="save-btn${isSaved ? ' saved' : ''}" onclick="toggleSave('${addr}',this,event)" title="${isSaved ? 'Saved' : 'Save property'}">${isSaved ? '♥' : '♡'}</button>
  </div>
  <div class="card-body">
    <div class="addr"><a href="${esc(c.gmapsUrl)}" target="_blank">${esc(c.address)}</a></div>
    <div><a href="${esc(c.realtorUrl)}" class="realtor-link" target="_blank">Google ↗</a></div>
    <div class="pills">
      <span class="pill">${esc(c.beds_bath)}</span>
      <span class="pill">${esc(c.basement)}</span>
      <span class="pill pill-blue">${esc(c.appraised)}</span>
    </div>
    <div class="cond" style="color:${condColor(cond)}">${esc(cond)}${distressHtml}</div>
    ${feats}
    <span class="badge ${secClass}">${secLabel}</span>
  </div>
</div>`;
}

function titleCase(s) {
    return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function render() {
    let all = [];
    for (const [street, list] of Object.entries(GALLERY.streets)) {
        list.forEach(c => all.push({ ...c, street }));
    }

    const savedSet = getSaved();
    let filtered;
    if (state.filter === 'saved') {
        filtered = all.filter(c => savedSet.has(c.address));
    } else {
        filtered = state.filter === 'all' ? all : all.filter(c => c.section === state.filter);
    }

    let html = '';
    if (state.sort) {
        const sorted = [...filtered].sort((a, b) => a.appraisedNum - b.appraisedNum);
        const label = state.filter === 'saved' ? 'Saved Properties' : 'All Properties';
        html =
            `<div class="street-header">${label} — Appraisal: Low → High ` +
            `<span class="ct">(${sorted.length})</span></div>` +
            `<div class="street-grid">${sorted.map(c => cardHtml(c, savedSet)).join('')}</div>`;
    } else if (state.filter === 'saved') {
        if (!filtered.length) {
            html = `<div class="street-header">No saved properties yet</div>
                    <p style="color:#6b7280;padding:1rem 0">Click the ♡ on any property card to save it here.</p>`;
        } else {
            html = `<div class="street-header">♥ Saved Properties <span class="ct">(${filtered.length})</span></div>` +
                   `<div class="street-grid">${filtered.map(c => cardHtml(c, savedSet)).join('')}</div>`;
        }
    } else {
        const byStreet = {};
        filtered.forEach(c => {
            (byStreet[c.street] = byStreet[c.street] || []).push(c);
        });
        for (const street of Object.keys(GALLERY.streets)) {
            const list = byStreet[street];
            if (!list || !list.length) continue;
            html +=
                `<div class="street-header">${titleCase(street)} ` +
                `<span class="ct">(${list.length})</span></div>` +
                `<div class="street-grid">${list.map(c => cardHtml(c, savedSet)).join('')}</div>`;
        }
    }

    document.getElementById('gallery').innerHTML = html;
}

function setFilter(section, btn) {
    state.filter = section;
    document.querySelectorAll('.fbtn:not(.sort-btn)').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function toggleSort(btn) {
    state.sort = !state.sort;
    btn.classList.toggle('active', state.sort);
    btn.textContent = state.sort ? '↑ Price ✓' : '↑ Price';
    render();
}

render();
updateSavedBtn();
</script>
</body>
</html>
