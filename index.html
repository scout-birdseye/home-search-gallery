<script>
const GALLERY = window.GALLERY_DATA;
const state   = { filter: 'all', sort: false };

function esc(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function condColor(c) {
    if (c.includes('Very Good+')) return '#065f46';
    if (c.includes('Very Good'))  return '#047857';
    if (c.includes('Good+'))      return '#059669';
    if (c.includes('Good'))       return '#16a34a';
    if (c.includes('Average+'))   return '#d97706';
    if (c.includes('Average'))    return '#b45309';
    if (c.includes('Fair'))       return '#dc2626';
    return '#6b7280';
}

const SECTION_META = {
    'move-in-ready': ['✅ Move-In Ready', 'badge-green'],
    'fixer-upper':   ['🔧 Fixer Upper',   'badge-yellow'],
    'over-budget':   ['💛 Over Budget',   'badge-pink'],
};

function cardHtml(c) {
    const dm      = (c.condition || '').match(/⚠️\d+late/);
    const distress = dm ? dm[0] : '';
    const cond     = (c.condition || '').replace(/\s*⚠️\S+/, '').trim();
    const [secLabel, secClass] = SECTION_META[c.section] || [c.section, 'badge-gray'];
    const feats = c.features && c.features !== '—'
        ? `<div class="feats">${esc(c.features)}</div>` : '';
    const distressHtml = distress
        ? ` <span class="distress">${esc(distress)}</span>` : '';
    return `
<div class="card">
  <div class="card-img"><img src="${esc(c.image)}" alt="${esc(c.address)}" loading="lazy"></div>
  <div class="card-body">
    <div class="addr"><a href="${esc(c.gmapsUrl)}" target="_blank">${esc(c.address)}</a></div>
    <div><a href="${esc(c.realtorUrl)}" class="realtor-link" target="_blank">realtor.com ↗</a></div>
    <div class="pills">
      <span class="pill">${esc(c.beds_bath)}</span>
      <span class="pill">${esc(c.basement)}</span>
      <span class="pill pill-blue">${esc(c.appraised)}</span>
    </div>
    <div class="cond" style="color:${condColor(cond)}">${esc(cond)}${distressHtml}</div>
    ${feats}
    <span class="badge ${secClass}">${secLabel}</span>
  </div>
</div>`;
}

function titleCase(s) {
    return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function render() {
    let all = [];
    for (const [street, list] of Object.entries(GALLERY.streets)) {
        list.forEach(c => all.push({ ...c, street }));
    }

    const filtered = state.filter === 'all'
        ? all : all.filter(c => c.section === state.filter);

    let html = '';
    if (state.sort) {
        const sorted = [...filtered].sort((a, b) => a.appraisedNum - b.appraisedNum);
        html =
            `<div class="street-header">All Properties — Appraisal: Low → High ` +
            `<span class="ct">(${sorted.length})</span></div>` +
            `<div class="street-grid">${sorted.map(cardHtml).join('')}</div>`;
    } else {
        const byStreet = {};
        filtered.forEach(c => {
            (byStreet[c.street] = byStreet[c.street] || []).push(c);
        });
        for (const street of Object.keys(GALLERY.streets)) {
            const list = byStreet[street];
            if (!list || !list.length) continue;
            html +=
                `<div class="street-header">${titleCase(street)} ` +
                `<span class="ct">(${list.length})</span></div>` +
                `<div class="street-grid">${list.map(cardHtml).join('')}</div>`;
        }
    }

    document.getElementById('gallery').innerHTML = html;
}

function setFilter(section, btn) {
    state.filter = section;
    document.querySelectorAll('.fbtn:not(.sort-btn)').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function toggleSort(btn) {
    state.sort = !state.sort;
    btn.classList.toggle('active', state.sort);
    btn.textContent = state.sort ? '↑ Price ✓' : '↑ Price';
    render();
}

render();
</script>
